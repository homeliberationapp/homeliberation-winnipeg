<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Your Free Property Analysis | Home Liberation Winnipeg</title>
    <meta name="description" content="Start your free consultation. Tell us about your property situation and we'll respond promptly.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2240 0%, #1a3a52 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .highlight {
            background: linear-gradient(135deg, #d4af37 0%, #f4c542 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 2rem;
        }

        .form-container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            color: #333;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0f2240;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #d4af37;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #0f2240;
        }

        .required {
            color: #d4af37;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #d4af37;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 16px 32px;
            background: linear-gradient(135deg, #d4af37 0%, #f4c542 100%);
            color: #0f2240;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .success-message,
        .error-message {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2rem;
            }

            .form-container {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Get Your Free <span class="highlight">Property Analysis</span></h1>
            <p class="subtitle">Takes 2-3 minutes | 100% Confidential | No Obligation</p>
        </header>

        <div class="form-container">
            <div id="successMessage" class="success-message hidden">
                ✅ Thank you! Your property information has been received. We'll contact you within 24 hours with our analysis.
            </div>

            <div id="errorMessage" class="error-message hidden"></div>

            <form id="leadForm">
                <!-- Property Information -->
                <div class="form-section">
                    <h2 class="section-title">Property Information</h2>

                    <div class="form-group">
                        <label>Property Address <span class="required">*</span></label>
                        <input type="text" name="propertyAddress" required placeholder="123 Main St, Winnipeg, MB">
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Property Type <span class="required">*</span></label>
                            <select name="propertyType" required>
                                <option value="">Select type...</option>
                                <option value="Single-Family Home">Single-Family Home</option>
                                <option value="Duplex (2 units)">Duplex (2 units)</option>
                                <option value="Triplex (3 units)">Triplex (3 units)</option>
                                <option value="Fourplex (4 units)">Fourplex (4 units)</option>
                                <option value="5-8 Units">5-8 Units</option>
                                <option value="9-12 Units">9-12 Units</option>
                                <option value="12+ Units">12+ Units</option>
                                <option value="Land/Lot Only">Land/Lot Only</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Bedrooms <span class="required">*</span></label>
                            <select name="bedrooms" required>
                                <option value="">Select...</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6+">6+</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Overall Condition <span class="required">*</span></label>
                        <select name="condition" required>
                            <option value="">Select condition...</option>
                            <option value="Excellent - Move-in ready, recently renovated">⭐⭐⭐⭐⭐ Excellent - Move-in ready, recently renovated</option>
                            <option value="Good - Well maintained, minor updates needed">⭐⭐⭐⭐ Good - Well maintained, minor updates needed</option>
                            <option value="Fair - Dated but livable, needs updates">⭐⭐⭐ Fair - Dated but livable, needs updates</option>
                            <option value="Poor - Major repairs needed">⭐⭐ Poor - Major repairs needed</option>
                            <option value="Very Poor - Uninhabitable/condemned">⭐ Very Poor - Uninhabitable/condemned</option>
                        </select>
                    </div>
                </div>

                <!-- Situation -->
                <div class="form-section">
                    <h2 class="section-title">Your Situation</h2>

                    <div class="form-group">
                        <label>Why are you selling? <span class="required">*</span></label>
                        <select name="reason" required>
                            <option value="">Select reason...</option>
                            <option value="Foreclosure / Behind on payments">Foreclosure / Behind on payments</option>
                            <option value="Inherited property">Inherited property</option>
                            <option value="Major repairs needed (can't afford)">Major repairs needed (can't afford)</option>
                            <option value="Divorce / Separation">Divorce / Separation</option>
                            <option value="Job loss / Relocation">Job loss / Relocation</option>
                            <option value="Tired of being a landlord">Tired of being a landlord</option>
                            <option value="Downsizing">Downsizing</option>
                            <option value="Just want to sell fast">Just want to sell fast</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Timeline <span class="required">*</span></label>
                            <select name="timeline" required>
                                <option value="">Select timeline...</option>
                                <option value="Immediately (1-7 days)">Immediately (1-7 days)</option>
                                <option value="1-2 weeks">1-2 weeks</option>
                                <option value="2-4 weeks">2-4 weeks</option>
                                <option value="30-60 days">30-60 days</option>
                                <option value="60+ days / Flexible">60+ days / Flexible</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Mortgage Status <span class="required">*</span></label>
                            <select name="mortgageStatus" required>
                                <option value="">Select status...</option>
                                <option value="No mortgage (owned free and clear)">No mortgage (owned free and clear)</option>
                                <option value="Current on payments">Current on payments</option>
                                <option value="1-2 months behind">1-2 months behind</option>
                                <option value="3-4 months behind">3-4 months behind</option>
                                <option value="5+ months behind">5+ months behind</option>
                                <option value="In foreclosure">In foreclosure</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Contact Information -->
                <div class="form-section">
                    <h2 class="section-title">Contact Information</h2>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>First Name <span class="required">*</span></label>
                            <input type="text" name="firstName" required placeholder="John">
                        </div>

                        <div class="form-group">
                            <label>Last Name <span class="required">*</span></label>
                            <input type="text" name="lastName" required placeholder="Smith">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Phone Number <span class="required">*</span></label>
                            <input type="tel" name="phone" required placeholder="(204) 555-1234">
                        </div>

                        <div class="form-group">
                            <label>Email <span class="required">*</span></label>
                            <input type="email" name="email" required placeholder="john@example.com">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Best Time to Call <span class="required">*</span></label>
                        <select name="bestTimeToCall" required>
                            <option value="">Select time...</option>
                            <option value="Morning (8-12 PM)">Morning (8-12 PM)</option>
                            <option value="Afternoon (12-5 PM)">Afternoon (12-5 PM)</option>
                            <option value="Evening (5-8 PM)">Evening (5-8 PM)</option>
                            <option value="Anytime">Anytime</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Additional Comments (Optional)</label>
                        <textarea name="comments" placeholder="Any additional information you'd like to share..."></textarea>
                    </div>
                </div>

                <button type="submit" id="submitBtn">
                    Get My Free Analysis
                </button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('leadForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            // Hide messages
            successMessage.classList.add('hidden');
            errorMessage.classList.add('hidden');

            try {
                // Get form data
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());

                // Submit to backend
                const response = await fetch('http://localhost:3000/api/leads', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    // Show success message
                    successMessage.textContent = `✅ Thank you! Your property information has been received. Lead ID: ${result.leadId}. Score: ${result.score}/600 (${result.priority} Priority). We'll contact you within 24 hours!`;
                    successMessage.classList.remove('hidden');

                    // Reset form
                    form.reset();

                    // Scroll to success message
                    successMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    throw new Error(result.error || 'Submission failed');
                }

            } catch (error) {
                console.error('Submission error:', error);
                errorMessage.textContent = `❌ ${error.message}. Please try again or call us directly at (204) XXX-XXXX`;
                errorMessage.classList.remove('hidden');
                errorMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } finally {
                // Re-enable submit button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Get My Free Analysis';
            }
        });
    </script>
</body>
</html>
